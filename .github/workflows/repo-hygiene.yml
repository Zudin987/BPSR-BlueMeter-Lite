name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block generated distribution binaries in source
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -Ei '\.(exe|msi|dll|apk|aab|zip|7z|rar|jar|pyc|pyo)$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "::error::Generated/binary distribution files must not be committed to the source tree. Publish build outputs as GitHub Release assets instead."
            printf '%s\n' "$forbidden"
            exit 1
          fi

      - name: Block signing material and credential files
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -Ei '(^|/)\.env($|\.)|\.(jks|keystore|pem|key|p12|pfx)$|(^|/)key\.properties$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "::error::Signing material or credential files must not be committed."
            printf '%s\n' "$forbidden"
            exit 1
          fi

      - name: Block obvious committed secret material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI -- '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}' -- . ':!.github/workflows/repo-hygiene.yml' 2>/dev/null; then
            echo "::error::Possible secret material detected in tracked source."
            exit 1
          fi

      - name: Block direct binary links in README
        shell: bash
        run: |
          set -euo pipefail
          for file in README README.md README.markdown README.rst; do
            [[ -f "$file" ]] || continue
            if grep -Ein 'releases/download|https?://[^ )"]+\.(exe|msi|dll|apk|aab|zip|7z|rar|jar)([?#][^ )"]*)?([ )"]|$)' "$file"; then
              echo "::error file=$file::Do not put direct executable/archive download links in the README. Keep binaries in GitHub Releases."
              exit 1
            fi
          done
