name: Build BlueMeter Lite APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-apk.yml"
      - "patch/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Lite patch kit
        uses: actions/checkout@v5

      - name: Clone BlueMeter upstream
        run: |
          git clone --depth 1 https://github.com/jbourny/bluemetermobile.git upstream

      - name: Record upstream revision
        run: |
          git -C upstream rev-parse HEAD > upstream/UPSTREAM_COMMIT.txt

      - name: Apply Lite patch
        run: |
          python3 patch/apply_lite_patch.py upstream

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: |
          java -version
          flutter --version
          dart --version

      - name: Add Dart SDK constraint
        working-directory: upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("pubspec.yaml")
          lines = path.read_text(encoding="utf-8").splitlines()

          environment_index = next(
              (
                  index
                  for index, line in enumerate(lines)
                  if line.strip() == "environment:"
              ),
              None,
          )

          if environment_index is None:
              dependencies_index = next(
                  index
                  for index, line in enumerate(lines)
                  if line.strip() == "dependencies:"
              )

              lines[dependencies_index:dependencies_index] = [
                  "environment:",
                  "  sdk: ^3.12.0",
                  "",
              ]
          else:
              section_end = next(
                  (
                      index
                      for index in range(environment_index + 1, len(lines))
                      if lines[index]
                      and not lines[index].startswith((" ", "\t"))
                  ),
                  len(lines),
              )

              sdk_index = next(
                  (
                      index
                      for index in range(
                          environment_index + 1,
                          section_end,
                      )
                      if lines[index].strip().startswith("sdk:")
                  ),
                  None,
              )

              if sdk_index is None:
                  lines.insert(
                      environment_index + 1,
                      "  sdk: ^3.12.0",
                  )
              else:
                  lines[sdk_index] = "  sdk: ^3.12.0"

          path.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Install dependencies
        working-directory: upstream
        run: |
          flutter pub get

      - name: Build release APKs
        working-directory: upstream
        run: |
          flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: bluemeter-lite-apk
          path: upstream/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare corresponding source artifact
        run: |
          rm -rf upstream/.git
          rm -rf upstream/build

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: bluemeter-lite-patched-source
          path: upstream
          include-hidden-files: true
          retention-days: 30
