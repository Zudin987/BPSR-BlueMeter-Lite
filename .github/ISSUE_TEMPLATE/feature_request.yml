name: Feature request
description: Suggest a focused improvement for BlueMeter Lite
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Describe the smallest useful version of the feature.
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Lite scope
      options:
        - label: This request is focused on the lightweight live Android DPS meter.
          required: true
