name: Bug report
description: Report a reproducible BlueMeter Lite problem
title: "[Bug] "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: BlueMeter Lite version
      placeholder: "Example: 1.0.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: "Example: Samsung Galaxy S24 Ultra, Android 16"
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: BPSR client
      options:
        - HaoPlay SEA
        - A Plus Japan / Global
        - Taiwan / Hong Kong / Macau
        - X.D. regional client
        - Other / unknown
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain the problem clearly.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start BlueMeter Lite
        2. Launch BPSR
        3. Enter ...
        4. The overlay ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or logs
      description: Do not upload raw packet captures, tokens or sensitive network data.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I tested the latest available release.
          required: true
        - label: I removed sensitive information from screenshots and logs.
          required: true
